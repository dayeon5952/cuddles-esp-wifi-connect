<!DOCTYPE html>
<html>
  <head>
    <title>WiFi Configuration</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Arial, sans-serif;
        /* Prevent content from overflowing */
        max-height: 100vh;
        box-sizing: border-box;
        padding: 20px;
      }

      .checkmark {
        width: 150px;
        height: 150px;
        margin-bottom: 30px;
      }

      .message {
        text-align: center;
        font-size: 20px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg class="checkmark" viewBox="0 0 52 52">
        <circle
          class="checkmark__circle"
          cx="26"
          cy="26"
          r="25"
          fill="none"
          stroke="#4CAF50"
          stroke-width="2"
        />
        <path
          class="checkmark__check"
          fill="none"
          stroke="#4CAF50"
          stroke-width="2"
          d="M14.1 27.2l7.1 7.2 16.7-16.8"
        />
      </svg>

      <div class="message">
        <!-- 메시지는 자바스크립트에서 동적으로 삽입됩니다. -->
      </div>
    </div>

    <script>
      window.addEventListener("load", function () {
        // 다국어 메시지 객체
        const messages = {
          "ar-SA": "تم التكوين بنجاح!",
          "bg-BG": "Конфигурацията е успешна!",
          "ca-ES": "Configuració exitosa!",
          "cs-CZ": "Konfigurace byla úspěšná!",
          "da-DK": "Konfigurationen lykkedes!",
          "de-DE": "Konfiguration erfolgreich!",
          "el-GR": "Η διαμόρφωση ήταν επιτυχής!",
          "en-US": "Configuration successful!",
          "es-ES": "¡Configuración exitosa!",
          "fa-IR": "پیکربندی با موفقیت انجام شد!",
          "fi-FI": "Määritys onnistui!",
          "fil-PH": "Matagumpay ang pagsasaayos!",
          "fr-FR": "Configuration réussie !",
          "he-IL": "ההגדרה הצליחה!",
          "hi-IN": "कॉन्फ़िगरेशन सफल रहा!",
          "hr-HR": "Konfiguracija je uspješna!",
          "hu-HU": "A konfiguráció sikeres!",
          "id-ID": "Konfigurasi berhasil!",
          "it-IT": "Configurazione riuscita!",

          "ja-JP": "設定が完了しました！",
          "ko-KR": "설정이 완료되었습니다!",
          "ms-MY": "Konfigurasi berjaya!",
          "nb-NO": "Konfigurasjonen var vellykket!",
          "nl-NL": "Configuratie geslaagd!",
          "pl-PL": "Konfiguracja zakończona sukcesem!",
          "pt-PT": "Configuração bem-sucedida!",
          "ro-RO": "Configurare reușită!",
          "ru-RU": "Конфигурация успешна!",
          "sk-SK": "Konfigurácia bola úspešná!",
          "sl-SI": "Konfiguracija je bila uspešna!",
          "sr-RS": "Конфигурација је успешна!",
          "sv-SE": "Konfigurationen lyckades!",
          "th-TH": "การกำหนดค่าประสบความสำเร็จ!",
          "tr-TR": "Yapılandırma başarılı!",
          "uk-UA": "Конфігурація успішна!",
          "vi-VN": "Cấu hình thành công!",
          "zh-CN": "配置成功！",
          "zh-TW": "設定成功！",
          // 필요에 따라 언어 추가
        };

        // 현재 URL의 쿼리스트링을 가져옴 (예: "?lang=ko-KR")
        const queryString = window.location.search;
        // URLSearchParams 객체 생성
        const urlParams = new URLSearchParams(queryString);
        // lang 파라미터 값 읽기
        const lang = urlParams.get("lang") || "en-US";
        // 메시지 선택 (없으면 영어)
        const message = messages[lang] || messages["en-US"];
        // 메시지 표시
        document.querySelector(".message").innerHTML = `<p>${message}</p>`;

        // Send exit request after a short delay
        setTimeout(function () {
          fetch("/exit", {
            method: "POST",
          })
            .then((response) => {
              if (response.ok) {
                console.log("Exit config mode request sent");
              } else {
                console.error("Failed to send exit request");
              }
            })
            .catch((error) => {
              console.error("Error:", error);
            });
        }, 1000);
      });
    </script>
  </body>
</html>
